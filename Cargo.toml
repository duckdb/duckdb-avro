[workspace]
# TODO: add "crates/avro-core" (the engine-free Avro container / schema / codec crate) once it lands.
members = ["crates/duckdb-capi-sys", "crates/duckdb-ext-api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/h4nsmuller/duckdb-avro-rs"
rust-version = "1.99"
publish = false

[workspace.dependencies]
duckdb-capi-sys = { path = "crates/duckdb-capi-sys" }
duckdb-ext-api = { path = "crates/duckdb-ext-api" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
new_ret_no_self = "allow"
new_without_default = "allow"
should_implement_trait = "allow"
wrong_self_convention = "allow"
module_inception = "allow"
inherent_to_string = "allow"
large_enum_variant = "allow"
enum_variant_names = "allow"
vec_box = "allow"
box_collection = "allow"
len_without_is_empty = "allow"
result_unit_err = "allow"
upper_case_acronyms = "allow"
excessive_precision = "allow"
neg_cmp_op_on_partial_ord = "allow"
chunks_exact_to_as_chunks = "allow"

[package]
name = "duckdb-avro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "avro: a reader and writer for Apache Avro object container files as a DuckDB extension on the C API v2 (read_avro, COPY TO FORMAT avro)"

[lints]
workspace = true

[lib]
name = "avro"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
# the C API v2 function table and types; the only engine surface the extension uses
duckdb-ext-api.workspace = true

[profile.release]
debug = 1
