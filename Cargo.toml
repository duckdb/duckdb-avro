[workspace]
members = ["crates/core", "crates/native", "crates/wasm"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
duckdb-neo = "=0.20000.2"
avro_core = { path = "crates/core" }
serde_json = "1"
flate2 = "1"
snap = "1"
crc32fast = "1"
bzip2 = "0.6"
ruzstd = "0.9"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }

[profile.release]
lto = true
strip = true
