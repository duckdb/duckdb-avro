# Clippy configuration of the workspace (the lint levels are in Cargo.toml `[workspace.lints]`).

avoid-breaking-exported-api = false
allow-unwrap-in-tests = true

# A lock result is never unwrapped: an unwind through a guard poisons the lock and the next `.lock().unwrap()` would be
# a second, unrelated panic. Use the `*_ignore_poison` accessors of `duckdb_ext_api::sync`. Only the FFI boundary of the
# extension API (`duckdb_ext_api::guard`) catches unwinds.
disallowed-methods = [
    { path = "std::panic::catch_unwind", reason = "only the FFI boundary catches unwinds (duckdb_ext_api::guard); mark a sanctioned site with #[expect(clippy::disallowed_methods, reason = ...)]" },
    { path = "std::sync::Mutex::lock", reason = "use duckdb_ext_api::sync::{lock_ignore_poison, MutexExt::lock_ignore_poison}" },
    { path = "std::sync::Mutex::try_lock", reason = "use duckdb_ext_api::sync::MutexExt::try_lock_ignore_poison" },
    { path = "std::sync::RwLock::read", reason = "use duckdb_ext_api::sync::{read_ignore_poison, RwLockExt::read_ignore_poison}" },
    { path = "std::sync::RwLock::write", reason = "use duckdb_ext_api::sync::{write_ignore_poison, RwLockExt::write_ignore_poison}" },
    { path = "std::sync::RwLock::try_read", reason = "use duckdb_ext_api::sync::RwLockExt::try_read_ignore_poison" },
    { path = "std::sync::RwLock::try_write", reason = "use duckdb_ext_api::sync::RwLockExt::try_write_ignore_poison" },
    { path = "std::sync::Condvar::wait", reason = "use duckdb_ext_api::sync::{wait_ignore_poison, CondvarExt}" },
    { path = "std::sync::Condvar::wait_timeout", reason = "use duckdb_ext_api::sync::CondvarExt::wait_timeout_ignore_poison" },
    { path = "std::sync::Condvar::wait_while", reason = "use duckdb_ext_api::sync::CondvarExt::wait_while_ignore_poison" },
    { path = "std::sync::Condvar::wait_timeout_while", reason = "use duckdb_ext_api::sync::CondvarExt::wait_timeout_while_ignore_poison" },
]
