name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push supersedes the runs of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --workspace -- -D warnings
      - run: cargo test --release --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pinned DuckDB (DUCKDB_PIN)
        run: |
          make venv
          venv/bin/python -c "import duckdb; print(duckdb.__version__, duckdb.sql('SELECT library_version, source_id FROM pragma_version()').fetchall()[0])"

      - name: Build the extension
        run: make

      - name: Smoke test
        run: |
          venv/bin/python -c "
          import duckdb
          con = duckdb.connect(config={'allow_unsigned_extensions': 'true'})
          con.sql(\"LOAD 'build/avro.duckdb_extension'\")
          rows = con.sql(\"SELECT extension_name, loaded FROM duckdb_extensions() WHERE extension_name = 'avro'\").fetchall()
          print(rows)
          assert rows == [('avro', True)], rows"

      - name: Test
        run: make test

  # the Kani proof harnesses (make kani): bounded model checking of avro-core's zigzag / varint / decoder / encoder /
  # CRC / min_encoded_size and of the extension's decimal, time, timestamp, duration and UUID conversions. Independent
  # of the other jobs; no DuckDB build involved. The action installs the pinned Kani release and its CBMC. Harnesses
  # run in sequence (one CBMC at a time, up to 8 GB each on the 16 GiB runner); the one harness that needs 17 GB sits
  # behind avro-core's kani-heavy feature, which only `make kani` enables.
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.68.0"
          args: -p avro-core -p duckdb-avro
